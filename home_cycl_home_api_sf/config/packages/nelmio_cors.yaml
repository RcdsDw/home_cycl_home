nelmio_cors:
    defaults:
        allow_origin:
            - "http://localhost:4000"
            - "https://home-cycl-home.rcds-dev.fr"
            - "https://dev.home-cycl-home.rcds-dev.fr"
        allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
        allow_headers: ["*"]
        max_age: 3600
        allow_credentials: true
        origin_regex: true
    paths:
        "^/": ~
